<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style>
      .box { fill: #0f172a; stroke: #94a3b8; stroke-width: 2; }
      .title { fill: #ffffff; font: 700 16px Arial, sans-serif; }
      .text { fill: #ffffff; font: 13px Arial, sans-serif; }
      .line { stroke: #94a3b8; stroke-width: 2; }
    </style>
  </defs>

  <!-- Boxes -->
  <rect class="box" x="40" y="40" width="260" height="190" />
  <text class="title" x="60" y="70">USERS</text>
  <text class="text" x="60" y="95">id (PK)</text>
  <text class="text" x="60" y="115">username (UNIQUE)</text>
  <text class="text" x="60" y="135">first_name</text>
  <text class="text" x="60" y="155">last_name</text>
  <text class="text" x="60" y="175">role_id (FK)</text>
  <text class="text" x="60" y="195">created_at, updated_at</text>

  <rect class="box" x="340" y="40" width="200" height="110" />
  <text class="title" x="360" y="70">ROLES</text>
  <text class="text" x="360" y="95">id (PK)</text>
  <text class="text" x="360" y="115">name (UNIQUE)</text>

  <rect class="box" x="40" y="270" width="300" height="210" />
  <text class="title" x="60" y="300">CATEGORIES</text>
  <text class="text" x="60" y="325">id (PK)</text>
  <text class="text" x="60" y="345">name</text>
  <text class="text" x="60" y="365">slug (UNIQUE)</text>
  <text class="text" x="60" y="385">description</text>
  <text class="text" x="60" y="405">created_by (FK)</text>
  <text class="text" x="60" y="425">status</text>
  <text class="text" x="60" y="445">created_at, updated_at</text>

  <rect class="box" x="380" y="270" width="300" height="210" />
  <text class="title" x="400" y="300">POSTS</text>
  <text class="text" x="400" y="325">id (PK)</text>
  <text class="text" x="400" y="345">title</text>
  <text class="text" x="400" y="365">slug (UNIQUE)</text>
  <text class="text" x="400" y="385">content</text>
  <text class="text" x="400" y="405">author_id (FK)</text>
  <text class="text" x="400" y="425">category_id (FK)</text>
  <text class="text" x="400" y="445">created_at, updated_at</text>

  <rect class="box" x="720" y="270" width="240" height="170" />
  <text class="title" x="740" y="300">MEDIA</text>
  <text class="text" x="740" y="325">id (PK)</text>
  <text class="text" x="740" y="345">name</text>
  <text class="text" x="740" y="365">url</text>
  <text class="text" x="740" y="385">created_by (FK)</text>
  <text class="text" x="740" y="405">created_at</text>

  <rect class="box" x="720" y="480" width="240" height="120" />
  <text class="title" x="740" y="510">POST_MEDIA</text>
  <text class="text" x="740" y="535">post_id (FK)</text>
  <text class="text" x="740" y="555">media_id (FK)</text>
  <text class="text" x="740" y="575">sort_order</text>

  <rect class="box" x="40" y="520" width="340" height="230" />
  <text class="title" x="60" y="550">PUBLISH_EVENTS</text>
  <text class="text" x="60" y="575">id (PK)</text>
  <text class="text" x="60" y="595">target_type</text>
  <text class="text" x="60" y="615">target_id</text>
  <text class="text" x="60" y="635">action</text>
  <text class="text" x="60" y="655">scheduled_at</text>
  <text class="text" x="60" y="675">executed_at</text>
  <text class="text" x="60" y="695">status</text>
  <text class="text" x="60" y="715">created_by (FK)</text>
  <text class="text" x="60" y="735">created_at</text>

  <!-- Lines -->
  <line class="line" x1="300" y1="90" x2="340" y2="90" />
  <line class="line" x1="170" y1="230" x2="170" y2="270" />
  <line class="line" x1="190" y1="230" x2="190" y2="520" />
  <line class="line" x1="340" y1="365" x2="380" y2="365" />
  <line class="line" x1="680" y1="365" x2="720" y2="365" />
  <line class="line" x1="680" y1="520" x2="720" y2="520" />
  <line class="line" x1="500" y1="480" x2="500" y2="520" />
</svg>
